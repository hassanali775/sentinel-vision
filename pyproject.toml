[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-vision"
version = "0.0.1"
description = "Visual world-state and event reasoning engine for industrial workspace monitoring and asset intelligence."
requires-python = ">=3.11"
readme = "README.md"
# ADR-0010: opencv-python (real video ingestion + rendering) and ultralytics
# (real object detection) are the project's first heavy-dependency
# exception, replacing the NumPy/stdlib-only ceiling every prior PR kept to.
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "ultralytics>=8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["sentinel_vision"]

# cv2 (opencv-python) and ultralytics ship no (or incomplete) type stubs.
# Treat just those imports as untyped rather than weakening strict mode
# project-wide; the override is scoped to exactly the modules this PR added
# (ADR-0010).
[[tool.mypy.overrides]]
module = ["cv2", "ultralytics"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
# Test dirs are flat (no __init__.py); importlib mode lets test files that
# share a basename across directories (e.g. tracking/test_base.py vs
# detection/test_base.py) be collected without module-name collisions.
